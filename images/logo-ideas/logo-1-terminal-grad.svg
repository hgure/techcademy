<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <!-- Terminal window icon -->
  <rect x="2" y="6" width="36" height="36" rx="8" fill="url(#grad1)"/>
  <defs>
    <linearGradient id="grad1" x1="2" y1="6" x2="38" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Terminal prompt arrow -->
  <path d="M12 18l6 6-6 6" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="22" y1="30" x2="30" y2="30" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Graduation cap accent (small) -->
  <path d="M30 10l5-3 5 3-5 3z" fill="#facc15"/>
  <line x1="35" y1="10" x2="35" y2="15" stroke="#facc15" stroke-width="1"/>
  <!-- Wordmark -->
  <text x="48" y="33" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">techcademy</text>
</svg>
