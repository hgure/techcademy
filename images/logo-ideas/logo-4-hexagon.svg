<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 48" fill="none">
  <defs>
    <linearGradient id="hexGrad" x1="0" y1="0" x2="40" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="48" y1="0" x2="240" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <!-- Hexagon -->
  <path d="M20 4l17 10v20l-17 10-17-10V14z" fill="none" stroke="url(#hexGrad)" stroke-width="2"/>
  <!-- Circuit lines inside hex -->
  <circle cx="20" cy="24" r="3" fill="url(#hexGrad)"/>
  <line x1="20" y1="21" x2="20" y2="12" stroke="url(#hexGrad)" stroke-width="1.5"/>
  <line x1="20" y1="27" x2="20" y2="36" stroke="url(#hexGrad)" stroke-width="1.5"/>
  <line x1="17" y1="22.5" x2="9" y2="18" stroke="url(#hexGrad)" stroke-width="1.5"/>
  <line x1="23" y1="25.5" x2="31" y2="30" stroke="url(#hexGrad)" stroke-width="1.5"/>
  <line x1="23" y1="22.5" x2="31" y2="18" stroke="url(#hexGrad)" stroke-width="1.5"/>
  <line x1="17" y1="25.5" x2="9" y2="30" stroke="url(#hexGrad)" stroke-width="1.5"/>
  <!-- Small dots at circuit ends -->
  <circle cx="20" cy="12" r="1.5" fill="url(#hexGrad)"/>
  <circle cx="20" cy="36" r="1.5" fill="url(#hexGrad)"/>
  <circle cx="9" cy="18" r="1.5" fill="url(#hexGrad)"/>
  <circle cx="31" cy="30" r="1.5" fill="url(#hexGrad)"/>
  <circle cx="31" cy="18" r="1.5" fill="url(#hexGrad)"/>
  <circle cx="9" cy="30" r="1.5" fill="url(#hexGrad)"/>
  <!-- Gradient wordmark -->
  <text x="48" y="32" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">techcademy</text>
</svg>
