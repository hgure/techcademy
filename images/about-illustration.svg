<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#abg)"/>
  <!-- Monitor -->
  <rect x="180" y="80" width="240" height="160" rx="8" stroke="#38bdf8" stroke-width="2" fill="#0f172a"/>
  <rect x="190" y="90" width="220" height="130" rx="4" fill="#1e293b"/>
  <rect x="270" y="240" width="60" height="20" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
  <rect x="250" y="258" width="100" height="6" rx="3" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
  <!-- Code lines on screen -->
  <rect x="200" y="100" width="80" height="4" rx="2" fill="#38bdf8" opacity="0.7"/>
  <rect x="200" y="112" width="120" height="4" rx="2" fill="#a78bfa" opacity="0.5"/>
  <rect x="210" y="124" width="100" height="4" rx="2" fill="#34d399" opacity="0.5"/>
  <rect x="210" y="136" width="60" height="4" rx="2" fill="#f97316" opacity="0.5"/>
  <rect x="200" y="148" width="90" height="4" rx="2" fill="#38bdf8" opacity="0.5"/>
  <rect x="210" y="160" width="140" height="4" rx="2" fill="#a78bfa" opacity="0.4"/>
  <rect x="200" y="172" width="70" height="4" rx="2" fill="#34d399" opacity="0.5"/>
  <rect x="200" y="184" width="110" height="4" rx="2" fill="#38bdf8" opacity="0.4"/>
  <!-- People silhouettes -->
  <circle cx="120" cy="300" r="20" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="100" y="325" width="40" height="50" rx="8" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="300" cy="310" r="20" fill="#1e3a5f" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="280" y="335" width="40" height="50" rx="8" fill="#1e3a5f" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="480" cy="300" r="20" fill="#1e3a5f" stroke="#34d399" stroke-width="1.5"/>
  <rect x="460" y="325" width="40" height="50" rx="8" fill="#1e3a5f" stroke="#34d399" stroke-width="1.5"/>
  <!-- Connection lines to screen -->
  <line x1="120" y1="280" x2="220" y2="240" stroke="#38bdf8" stroke-width="1" opacity="0.3" stroke-dasharray="4 4"/>
  <line x1="300" y1="290" x2="300" y2="260" stroke="#a78bfa" stroke-width="1" opacity="0.3" stroke-dasharray="4 4"/>
  <line x1="480" y1="280" x2="380" y2="240" stroke="#34d399" stroke-width="1" opacity="0.3" stroke-dasharray="4 4"/>
  <!-- Floating icons -->
  <circle cx="80" cy="120" r="15" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
  <text x="74" y="125" font-family="monospace" font-size="12" fill="#38bdf8" opacity="0.6">☁</text>
  <circle cx="520" cy="130" r="15" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>
  <text x="514" y="135" font-family="monospace" font-size="12" fill="#a78bfa" opacity="0.6">⚙</text>
</svg>
