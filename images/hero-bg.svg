<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="600" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="600"/><line x1="80" y1="0" x2="80" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="600"/><line x1="240" y1="0" x2="240" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/><line x1="560" y1="0" x2="560" y2="600"/>
    <line x1="640" y1="0" x2="640" y2="600"/><line x1="720" y1="0" x2="720" y2="600"/>
    <line x1="800" y1="0" x2="800" y2="600"/><line x1="880" y1="0" x2="880" y2="600"/>
    <line x1="960" y1="0" x2="960" y2="600"/><line x1="1040" y1="0" x2="1040" y2="600"/>
    <line x1="1120" y1="0" x2="1120" y2="600"/><line x1="1200" y1="0" x2="1200" y2="600"/>
    <line x1="1280" y1="0" x2="1280" y2="600"/><line x1="1360" y1="0" x2="1360" y2="600"/>
    <line x1="0" y1="0" x2="1440" y2="0"/><line x1="0" y1="80" x2="1440" y2="80"/>
    <line x1="0" y1="160" x2="1440" y2="160"/><line x1="0" y1="240" x2="1440" y2="240"/>
    <line x1="0" y1="320" x2="1440" y2="320"/><line x1="0" y1="400" x2="1440" y2="400"/>
    <line x1="0" y1="480" x2="1440" y2="480"/>
  </g>
  <!-- Floating nodes -->
  <circle cx="200" cy="150" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="400" cy="300" r="3" fill="#818cf8" opacity="0.5"/>
  <circle cx="700" cy="100" r="5" fill="#38bdf8" opacity="0.4"/>
  <circle cx="900" cy="250" r="3" fill="#a78bfa" opacity="0.6"/>
  <circle cx="1100" cy="180" r="4" fill="#38bdf8" opacity="0.5"/>
  <circle cx="1250" cy="400" r="3" fill="#818cf8" opacity="0.4"/>
  <circle cx="300" cy="450" r="4" fill="#a78bfa" opacity="0.5"/>
  <circle cx="600" cy="500" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="1000" cy="450" r="5" fill="#818cf8" opacity="0.4"/>
  <!-- Connection lines -->
  <line x1="200" y1="150" x2="400" y2="300" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="400" y1="300" x2="700" y2="100" stroke="#818cf8" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="700" y1="100" x2="900" y2="250" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="900" y1="250" x2="1100" y2="180" stroke="#a78bfa" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="300" y1="450" x2="600" y2="500" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1"/>
  <line x1="600" y1="500" x2="1000" y2="450" stroke="#818cf8" stroke-opacity="0.1" stroke-width="1"/>
  <!-- Glowing orbs -->
  <circle cx="720" cy="300" r="200" fill="url(#glow)" opacity="0.3"/>
  <circle cx="300" cy="200" r="150" fill="url(#glow)" opacity="0.2"/>
  <circle cx="1100" cy="350" r="180" fill="url(#glow)" opacity="0.15"/>
</svg>
